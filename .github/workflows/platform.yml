# Type-checks and tests the platform library in packages/platform (see packages/platform/README.md).
# naive-framework comes from tchjhnsn/naive. If it is private again, the repository secret NAIVE_READ_TOKEN is a read-only token for it.
name: platform

on:
  push:
    branches: [main]
    paths: ["packages/platform/**", ".github/workflows/platform.yml"]
  pull_request:
    paths: ["packages/platform/**", ".github/workflows/platform.yml"]

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway Postgres for the connector, outside-log and hosted-workspace tests. Its password is not a secret.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mentura
          POSTGRES_PASSWORD: mentura-eval
          POSTGRES_DB: mentura_eval
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mentura" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MENTURA_EVAL_DATABASE_URL: postgres://mentura:mentura-eval@localhost:5432/mentura_eval
    defaults:
      run:
        working-directory: packages/platform
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # No GITHUB_TOKEN header left in git config: it would override the naive read token.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Git can fetch naive-framework
        run: sh naive-git-auth.sh
        env:
          NAIVE_READ_TOKEN: ${{ secrets.NAIVE_READ_TOKEN }}
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc -p tsconfig.json
      - name: Tests
        run: node test.ts
