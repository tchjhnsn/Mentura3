# Builds the Lean proofs in lean/ and checks that the generated ontology file is current (see lean/README.md).
name: lean

on:
  push:
    branches: [main]
    paths: ["lean/**", "packages/core/src/terms/**", "scripts/ontology-lean.ts", ".github/workflows/lean.yml"]
  pull_request:
    paths: ["lean/**", "packages/core/src/terms/**", "scripts/ontology-lean.ts", ".github/workflows/lean.yml"]

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18"
      - name: The generated ontology is current
        run: node scripts/ontology-lean.ts --check
      # Installs elan and the toolchain in lean/lean-toolchain, then runs lake build in lean/.
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: lean
          auto-config: "false"
          build: "true"
          use-mathlib-cache: "false"
